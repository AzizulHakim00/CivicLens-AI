name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Smoke-test the Worker runtime
        shell: bash
        run: |
          npx wrangler dev --local --port 8787 > /tmp/civiclens-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/civiclens-home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/civiclens-worker.log
            exit 1
          fi

          grep -q "CivicLens" /tmp/civiclens-home.html || {
            cat /tmp/civiclens-worker.log
            cat /tmp/civiclens-home.html
            exit 1
          }

          api_status=$(curl --silent --output /tmp/civiclens-api.json --write-out "%{http_code}" \
            --request POST \
            --header "content-type: application/json" \
            --data '{"type":"Unknown"}' \
            http://127.0.0.1:8787/api/reports)

          if [ "$api_status" != "400" ]; then
            cat /tmp/civiclens-worker.log
            cat /tmp/civiclens-api.json
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ai-service/requirements.txt
      - run: pytest ai-service/tests -q

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare and verify visual v4
        id: verify
        continue-on-error: true
        shell: bash
        env:
          PRODUCTION_URL: https://civiclens-ai.mdomor01815.workers.dev
        run: |
          verified=0
          for attempt in {1..36}; do
            cache_buster="${GITHUB_SHA}-${attempt}"
            if curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "${PRODUCTION_URL}/?deployment=${cache_buster}" \
              --output /tmp/civiclens-production.html; then
              if grep -q 'name="visual-version" content="4.0"' /tmp/civiclens-production.html; then
                if curl --fail --silent --show-error \
                  --header "Cache-Control: no-cache" \
                  "${PRODUCTION_URL}/api/health?deployment=${cache_buster}" \
                  --output /tmp/civiclens-health.json \
                  && grep -q '"status":"ok"' /tmp/civiclens-health.json; then
                  verified=1
                  break
                fi
              fi
            fi
            sleep 10
          done

          if [ "$verified" -ne 1 ]; then
            echo "Cloudflare did not expose the expected visual v4 build within the verification window."
            test -f /tmp/civiclens-production.html && head -c 1200 /tmp/civiclens-production.html || true
            test -f /tmp/civiclens-health.json && cat /tmp/civiclens-health.json || true
            exit 1
          fi

          echo "Production visual v4 and the D1 health endpoint are live."

      - name: Publish production commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state="success"
            description="Cloudflare visual v4 and D1 health are live"
          else
            state="failure"
            description="Cloudflare production verification failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="production/civiclens" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"

      - name: Fail when production verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
