name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Smoke-test atomic authentication and Worker runtime
        shell: bash
        run: |
          npx wrangler d1 execute civiclens-production-db --local --file cloudflare-schema.sql
          npx wrangler dev --local --port 8787 > /tmp/civiclens-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/civiclens-home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/civiclens-worker.log
            exit 1
          fi

          grep -q "CivicLens" /tmp/civiclens-home.html || {
            cat /tmp/civiclens-worker.log
            cat /tmp/civiclens-home.html
            exit 1
          }

          grep -q 'name="multiuser-version" content="6.1"' /tmp/civiclens-home.html || {
            cat /tmp/civiclens-home.html
            exit 1
          }
          grep -q 'name="performance-version" content="6.1"' /tmp/civiclens-home.html || {
            cat /tmp/civiclens-home.html
            exit 1
          }

          auth_status=$(curl --silent --output /tmp/civiclens-auth.json --write-out "%{http_code}" \
            http://127.0.0.1:8787/api/auth/me)
          test "$auth_status" = "401" || { cat /tmp/civiclens-auth.json; exit 1; }

          register_result=$(curl --silent --show-error --dump-header /tmp/civiclens-register.headers \
            --output /tmp/civiclens-register.json --write-out "%{http_code} %{time_total}" \
            --request POST \
            --header "Origin: http://127.0.0.1:8787" \
            --header "content-type: application/json" \
            --data '{"name":"CI Owner","organization":"CivicLens Test Authority","email":"ci-owner@example.com","password":"CivicLens2026Secure"}' \
            http://127.0.0.1:8787/api/auth/register)
          read -r register_status register_time <<< "$register_result"
          test "$register_status" = "201" || { cat /tmp/civiclens-worker.log; cat /tmp/civiclens-register.json; exit 1; }
          awk "BEGIN { exit !($register_time < 12) }" || { echo "Registration was too slow: ${register_time}s"; exit 1; }
          grep -q '"role":"admin"' /tmp/civiclens-register.json || { cat /tmp/civiclens-register.json; exit 1; }
          grep -q '"ownerClaimed":true' /tmp/civiclens-register.json || { cat /tmp/civiclens-register.json; exit 1; }

          session_token=$(grep -i '^set-cookie:' /tmp/civiclens-register.headers | sed -E 's/.*civiclens_session=([^;]+).*/\1/' | tr -d '\r')
          test -n "$session_token" || { cat /tmp/civiclens-register.headers; exit 1; }

          me_status=$(curl --silent --output /tmp/civiclens-me.json --write-out "%{http_code}" \
            --header "Cookie: civiclens_session=${session_token}" \
            http://127.0.0.1:8787/api/auth/me)
          test "$me_status" = "200" || { cat /tmp/civiclens-me.json; exit 1; }
          grep -q '"manageUsers":true' /tmp/civiclens-me.json || { cat /tmp/civiclens-me.json; exit 1; }

          # Repeating registration with the same valid credentials must recover
          # a previously interrupted account instead of returning a conflict.
          resume_status=$(curl --silent --show-error --dump-header /tmp/civiclens-resume.headers \
            --output /tmp/civiclens-resume.json --write-out "%{http_code}" \
            --request POST \
            --header "Origin: http://127.0.0.1:8787" \
            --header "content-type: application/json" \
            --data '{"name":"CI Owner","organization":"CivicLens Test Authority","email":"ci-owner@example.com","password":"CivicLens2026Secure"}' \
            http://127.0.0.1:8787/api/auth/register)
          test "$resume_status" = "200" || { cat /tmp/civiclens-resume.json; exit 1; }
          grep -q '"resumed":true' /tmp/civiclens-resume.json || { cat /tmp/civiclens-resume.json; exit 1; }

          report_status=$(curl --silent --output /tmp/civiclens-created-report.json --write-out "%{http_code}" \
            --request POST \
            --header "Origin: http://127.0.0.1:8787" \
            --header "Cookie: civiclens_session=${session_token}" \
            --header "content-type: application/json" \
            --data '{"id":"CL-990001","type":"Pothole","severity":"High","confidence":94,"location":"CI Test Road","area":"CI Zone","status":"Reported","source":"Citizen","slaMinutes":180,"priorityScore":78}' \
            http://127.0.0.1:8787/api/reports)
          test "$report_status" = "201" || { cat /tmp/civiclens-created-report.json; exit 1; }

          patch_status=$(curl --silent --output /tmp/civiclens-patched-report.json --write-out "%{http_code}" \
            --request PATCH \
            --header "Origin: http://127.0.0.1:8787" \
            --header "Cookie: civiclens_session=${session_token}" \
            --header "content-type: application/json" \
            --data '{"id":"CL-990001","status":"Investigating","assignedTeam":"CI Road Team"}' \
            http://127.0.0.1:8787/api/reports)
          test "$patch_status" = "200" || { cat /tmp/civiclens-patched-report.json; exit 1; }
          grep -q '"status":"Investigating"' /tmp/civiclens-patched-report.json || { cat /tmp/civiclens-patched-report.json; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ai-service/requirements.txt
      - run: pytest ai-service/tests -q

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare and verify auth/performance v6.1
        id: verify
        continue-on-error: true
        shell: bash
        env:
          PRODUCTION_URL: https://civiclens-ai.mdomor01815.workers.dev
        run: |
          verified=0
          for attempt in {1..36}; do
            cache_buster="${GITHUB_SHA}-${attempt}"
            if curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "${PRODUCTION_URL}/?deployment=${cache_buster}" \
              --output /tmp/civiclens-production.html; then
              if grep -q 'name="multiuser-version" content="6.1"' /tmp/civiclens-production.html \
                && grep -q 'name="performance-version" content="6.1"' /tmp/civiclens-production.html; then
                if curl --fail --silent --show-error \
                  --header "Cache-Control: no-cache" \
                  "${PRODUCTION_URL}/api/health?deployment=${cache_buster}" \
                  --output /tmp/civiclens-health.json \
                  && grep -q '"status":"ok"' /tmp/civiclens-health.json \
                  && grep -q '"multiuser":{"status":"ready"' /tmp/civiclens-health.json \
                  && grep -q '"authentication":{"status":"ready","registration":"atomic"' /tmp/civiclens-health.json \
                  && grep -q '"performance":{"version":"6.1"' /tmp/civiclens-health.json; then
                  verified=1
                  break
                fi
              fi
            fi
            sleep 10
          done

          if [ "$verified" -ne 1 ]; then
            echo "Cloudflare did not expose the expected auth/performance v6.1 build within the verification window."
            test -f /tmp/civiclens-production.html && head -c 1200 /tmp/civiclens-production.html || true
            test -f /tmp/civiclens-health.json && cat /tmp/civiclens-health.json || true
            exit 1
          fi

          echo "Production atomic registration, account recovery, adaptive runtime and D1 health are live."

      - name: Publish production commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state="success"
            description="Cloudflare auth and performance v6.1 are live"
          else
            state="failure"
            description="Cloudflare production verification failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="production/civiclens" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"

      - name: Fail when production verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
